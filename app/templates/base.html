<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pivot Ad-Free</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#e8e8e8;min-height:100vh}
    a{color:#6b9fff;text-decoration:none}a:hover{text-decoration:underline}
    header{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:1rem 2rem;display:flex;align-items:center;gap:1rem}
    header h1{font-size:1.2rem;font-weight:600}
    header nav a{margin-left:1.5rem;font-size:0.9rem;color:#aaa}
    main{max-width:960px;margin:2rem auto;padding:0 1.5rem}
    .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600;text-transform:uppercase}
    .badge-pending{background:#333;color:#aaa}
    .badge-downloading{background:#1a3a5c;color:#6bb3ff}
    .badge-transcribing{background:#2a1f4a;color:#b07eff}
    .badge-pending_review{background:#3a2700;color:#ffb347}
    .badge-processing{background:#1a3a1a;color:#6dff6d}
    .badge-published{background:#0a2a0a;color:#4dbb4d}
    .badge-error{background:#3a0a0a;color:#ff6b6b}
    button{cursor:pointer;border:none;border-radius:6px;padding:.5rem 1.2rem;font-size:.9rem;font-weight:600}
    .btn-primary{background:#6b9fff;color:#000}.btn-primary:hover{background:#5588ee}
    .btn-danger{background:#c0392b;color:#fff}.btn-success{background:#27ae60;color:#fff}
  </style>
</head>
<body>
<header>
  <h1>🎙 Pivot Ad-Free</h1>
  <nav><a href="/">Episodes</a><a href="/feed.xml" target="_blank">RSS Feed</a></nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
